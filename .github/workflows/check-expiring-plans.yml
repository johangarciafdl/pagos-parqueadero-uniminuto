name: Check expiring plans

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-expiring-plans endpoint
        run: |
          curl -sf -X POST "${BACKEND_URL}/api/v1/internal/check-expiring-plans" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
