name: Keep Render service awake

# El plan gratuito de Render duerme el servicio tras 15 min sin trafico, y la
# siguiente visita paga el "cold start" (la pantalla de "waking up" de
# Render). Este ping cada 10 minutos evita que llegue a dormirse.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health-check endpoint
        # --retry: el primer intento durante un "cold start" real de Render
        # normalmente devuelve 502/503 mientras el contenedor arranca; sin
        # reintentos, ese ping se marcaba como "failure" en vez de terminar
        # de despertar el servicio.
        run: >
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors
          "https://parqueadero-uniminuto.onrender.com/api/v1/utils/health-check/"
